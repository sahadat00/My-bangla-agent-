name: agent
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install requests edge-tts gTTS
      - run: python agent.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
      - name: Render video
        if: hashFiles('video_ready.flag') != ''
        working-directory: video
        run: |
          npm install
          npx remotion render src/index.tsx Main out.mp4
      - name: Compress video
        if: hashFiles('video_ready.flag') != ''
        run: |
          ls -la video/out.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 video/out.mp4)
          AUDIO_KBPS=128
          TOTAL_KBITS=$(python3 -c "print(int(45*8*1000))")
          VIDEO_KBPS=$(python3 -c "d=float('$DURATION'); print(max(300, int($TOTAL_KBITS/d - $AUDIO_KBPS)))")
          echo "Duration: $DURATION s, video bitrate: $VIDEO_KBPS kbps"
          ffmpeg -y -i video/out.mp4 \
            -c:v libx264 -preset veryfast \
            -b:v ${VIDEO_KBPS}k -maxrate ${VIDEO_KBPS}k -bufsize $((VIDEO_KBPS*2))k \
            -c:a aac -b:a ${AUDIO_KBPS}k \
            -movflags +faststart \
            video/small.mp4
          ls -la video/small.mp4
      - name: Send video
        if: hashFiles('video_ready.flag') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
        run: |
          ls -la video/small.mp4
          RESPONSE=$(curl -s -F chat_id="$ALLOWED_CHAT_ID" -F video=@video/small.mp4 -F caption="ভিডিও প্রিভিউ" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || exit 1
