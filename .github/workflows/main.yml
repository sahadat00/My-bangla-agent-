name: agent
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
concurrency:
  group: agent
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check Telegram for new messages
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          N=$(curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?timeout=0" | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('result',[])))" 2>/dev/null || echo 0)
          echo "Pending messages: $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.n != '0'
      - uses: actions/setup-python@v5
        if: steps.check.outputs.n != '0'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.n != '0'
        with:
          node-version: "20"
      - name: Install tools
        if: steps.check.outputs.n != '0'
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests edge-tts gTTS
      - name: Run agent
        if: steps.check.outputs.n != '0'
        run: python agent.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
      - name: Render video
        if: steps.check.outputs.n != '0' && hashFiles('video_ready.flag') != ''
        working-directory: video
        run: |
          npm install
          npx remotion render src/index.tsx Main out.mp4
      - name: Compress video
        if: steps.check.outputs.n != '0' && hashFiles('video_ready.flag') != ''
        run: |
          ls -la video/out.mp4
          DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 video/out.mp4)
          AUDIO_KBPS=128
          TOTAL_KBITS=$(python3 -c "print(int(45*8*1000))")
          VIDEO_KBPS=$(python3 -c "d=float('$DURATION'); print(max(300, int($TOTAL_KBITS/d - $AUDIO_KBPS)))")
          echo "Duration: $DURATION s, video bitrate: $VIDEO_KBPS kbps"
          ffmpeg -y -i video/out.mp4 \
            -c:v libx264 -preset veryfast \
            -b:v ${VIDEO_KBPS}k -maxrate ${VIDEO_KBPS}k -bufsize $((VIDEO_KBPS*2))k \
            -c:a aac -b:a ${AUDIO_KBPS}k \
            -movflags +faststart \
            video/small.mp4
          ls -la video/small.mp4
      - name: Send video
        if: steps.check.outputs.n != '0' && hashFiles('video_ready.flag') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
        run: |
          ls -la video/small.mp4
          RESPONSE=$(curl -s -F chat_id="$ALLOWED_CHAT_ID" -F video=@video/small.mp4 -F caption="ভিডিও প্রিভিউ" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo")
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || exit 1
      - name: Tell me if something failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="$ALLOWED_CHAT_ID" \
            --data-urlencode "text=ত্রুটি: ভিডিও বানানোর রান ব্যর্থ হয়েছে। লগ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
